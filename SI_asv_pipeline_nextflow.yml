    - group1_isa_all_labeled
    - group1_isa_mag_all
    - group2_isa_all
    - group2_isa_all_labeled
    - group2_isa_mag_all
    - group3_isa_all
    - group3_isa_all_labeled
    - group3_isa_mag_all
    - group4_isa_all
    - group4_isa_all_labeled
    - group4_isa_mag_all
    - module_all
    - module_all_labeled
    - mag_pair_all
    - mag_pair_tax_all
    - phylum_abund_all
    - phylum_isa_all
    - phylum_isa_all_labeled
  transpose: true
  min_rel_abund: 0.01
  min_prevalence: 0.01
  remove_zero_var: true
  method: glasso
  lambda_min_ratio: 0.01
  nlambda: 20
  rep_num: 50
  thresh: 0.1
  ncores: 8
  seed: 10010
  edge_threshold: 0.01
  keep_negative: false
  layout_iters: 1000
  force_filter: true
  force_spieceasi: true
  force_graphs: true
