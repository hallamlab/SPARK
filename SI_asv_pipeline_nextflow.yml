paths:
  input_dir: /cephfs/rjm_work/si_asv/V4_ncbi_input
  output_dir: /cephfs/rjm_work/si_asv/NF_V4_ncbi_output
  manifest: /cephfs/rjm_work/si_asv/ref_db/sample_manifest.tsv
  work_dir: /cephfs/rjm_work/si_asv/nf_work
  conda_cache_dir: /cephfs/rjm_work/si_asv/conda_cache
    # Optional: set to an NFS/CephFS path to override Nextflow's -w (e.g. /mnt/ceph/work)

resources:
  threads: 12          # per-sample processes (FASTP/MERGE/FILTER) use this many threads
  single_end: false


biochem_pre_asv:
  enabled: true
  table_a: /cephfs/rjm_work/si_asv/ref_db/SI_JA_Compiled_Geochem_Dec_09_Outlier_RM.csv
  table_b: /cephfs/rjm_work/si_asv/ref_db/SI_JA_Compiled_CTD_Data_Dec_18_2025_Outlier_RM.csv
  output_root: /cephfs/rjm_work/si_asv/NF_V4_ncbi_output/biochem_pipeline
  cleaned_density_filename: 02_oxygen_best_available_density_RJM.tsv
  clean_keep_cols:
    - cruise_year_month_depth
    - Cruise
    - Year
    - Month
    - Day
    - Depth
    - Phosphate
    - Silicate
    - Nitrite
    - Nitrate
    - Ammonium
    - Hydrogen Sulfide
    - Nitrous Oxide
    - Methane
    - Temperature
    - Salinity
    - Oxygen
    - Density
    - Fe
    - Dimethyl Sulfide
  clean_drop_cols: []
  clean_rename_map:
    PO4: Phosphate
    SI: Silicate
    NO2: Nitrite
    NO3: Nitrate
    NH4: Ammonium
    H2S: Hydrogen Sulfide
    N2O: Nitrous Oxide
    CH4: Methane
    Oxygen_best_available: Oxygen
    density_kg_m3: Density
  feature_cols: Oxygen,Nitrate,Nitrite,Nitrous Oxide,Ammonium,Hydrogen Sulfide,Methane,Phosphate,Silicate,Temperature,Salinity,Density,Fe,Dimethyl Sulfide
  gmm_k: auto
  eof_pcs: 1,2,4

filename_patterns:
  r1_tokens:
    - R1
    - 1
  r2_tokens:
    - R2
    - 2
  ext_patterns:
    - "\\.fastq\\.gz$"
    - "\\.fq\\.gz$"
    - "\\.fastq$"
    - "\\.fq$"
  sample_strip_regex: "(_S[0-9]+)?(_L[0-9]{3})?(_R[12])?(_[12])?(_001)?$"

fastp:
  trim_front_r1: 19
  trim_tail_r1: 20
  trim_front_r2: 20
  trim_tail_r2: 20

merge:
  max_diffs: 20
  min_overlap: 5
  trunc_quality: 5
  allow_stagger: true

table_filter:
  min_sample_sum: 5000
  min_asv_sum: 0
  script: filter_ASV_table.py

filter:
  max_ee: 1.0
  min_len: 245
  max_len: 1500

concat:
  relabel: true
  label_sep: ":"

unoise:
  min_size: 3

swarm:
  distance: 1

sina:
  reference:
  reference_url: https://www.arb-silva.de/fileadmin/silva_databases/release_138_2/ARB_files/SILVA_138.2_SSURef_NR99_03_07_24_opt.arb.gz
  download_subdir: sina_reference
  regions:
    - V4
  trim_to: V4
  batch_size: 1000000
  keep_gaps: false
  threads: 16
  verbose: false

taxonomy:
  ref_taxonomy:
  ref_taxonomy_url: https://data.qiime2.org/2024.10/common/silva-138-99-tax.qza
  ref_taxonomy_filename: silva-138_2-ssu-nr99-tax.qza
  ref_sequences:
  ref_sequences_url: https://data.qiime2.org/2024.10/common/silva-138-99-seqs.qza
  ref_sequences_filename: silva-138_2-ssu-nr99-seqs-DNA.qza
  download_subdir: taxonomy_reference
  output_dir: taxonomy
  output_tsv: ASV_SILVA_tax.full-length.vsearch.tsv
  stats_tsv: ASV_SILVA_stats.full-length.vsearch.tsv
  uppercase_fasta: ASVs.upper.fasta
  threads: 16

mito:
  enabled: true
  chunk_dir:
  chunk_size: 10
  mitomaster_workers: 8
  mitomaster_retries: 4
  mitomaster_timeout: 90
  mitomaster_header_mode: first
  output_dir: mito/mitomap
  prefix: nontarget
  formats: svg,pdf
  min_pident: 97.0
  min_percov: 51.0
  mitochondria_substring: mitochondria
  feature_col: "Feature ID"
  taxon_col: Taxon
  consensus_col: Consensus
  steps: "BioFactorial,Qiime_NB_FULL,MITOMASTER,BLAST_mito"
  host_first_step: BioFactorial
  figsize: 10x6
  style: whitegrid
  dpi: 300
  no_plots: false
  blast_threads: 16
  mito_db: /cephfs/rjm_work/si_asv/ref_db/mito_ncbi
  biof_db: /cephfs/rjm_work/si_asv/ref_db/ssu_pipeline_contaminants

filter_counts:
  enabled: true
  metadata: ../ref_db/asv_cruise_metadata.tsv
  output: ASV_target.tsv
  group_col: Depth
  min_group_size: 3
  abundance_threshold: 0.005
  sample_id_col: sampleID
  min_consensus: 0.0
  taxon_col: Taxon
  consensus_col: Consensus
  biofactorial_col: BioFactorial
  mito_cols:
    - MITOMASTER
    - BLAST_mito
  save_intermediates: true
  mito_output_dir: mito/ASVs

general_stats:
  enabled: true

sankey:
  enabled: true
  metadata: ../ref_db/asv_cruise_metadata.tsv
  sub_dir: .
  sample_col: sampleID
  group1_col: Depth
  color_col: Color
  keep_types:
  output_prefix: metadata/data_loss_sankey
  title: Data Loss Flow
  make_labeled: true
  make_unlabeled: true

metadata_plots:
  enabled: true
  metadata: ../ref_db/asv_cruise_metadata.tsv
  sub_dir: .
  sample_col: sampleID
  type_col: Depth
  color_col: Color
  biochem_assignments: /cephfs/rjm_work/si_asv/NF_V4_ncbi_output/biochem_pipeline/env_o2_split_by_gmm/tables/merged_o2_split_by_gmm.csv
  biochem_sample_col: cruise_year_month_depth
  biochem_meta_join_cols: Cruise,Depth
  biochem_join_cols: Cruise,Depth_anchored
  biochem_include_cols: []
  stratification_timeseries: /cephfs/rjm_work/si_asv/NF_V4_ncbi_output/biochem_pipeline/env_stratification_index/stratification_timeseries.tsv
  strat_meta_join_col: Cruise
  strat_join_col: Cruise
  strat_include_cols: []
  keep_types:
  include_rank: []
  run_micro: true
  run_mito: true

batch_correction:
  enabled: true
  output_dir: batch_correction
  batch_col: plateID
  asv_orientation: features_rows
  biological_covariates: Depth,Season 
  biological_color_col: Depth,Season 
  color_palette_col: Color
  conqur_mode: libsize
  conqur_num_core: 12
  conqur_batch_ref:
  conqur_logistic_lasso: false
  conqur_quantile_type: standard
  conqur_simple_match: false
  conqur_lambda_quantile: 2p/n
  conqur_interplt: false
  conqur_delta: 0.4999
  conqur_auto_install: true
  umap_neighbors: 15
  umap_min_dist: 0.1
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples:
  hdbscan_selection_method: eom
  optimize_clustering: false
  target_clusters: 3-8
  n_features_plot: 5
  random_state: 42

outlier_detection:
  enabled: true
  output_dir: outliers_corrected
  group_cols:
    - Depth,Season
  transform: none
  asv_orientation: samples_rows
  pre_transformed: true
  scale: false
  use_iso: true
  use_svm: true
  use_hdb: true
  vote_threshold: 3
  iso_contamination: auto
  iso_estimators: 200
  iso_random_state: 42
  svm_kernel: rbf
  svm_gamma: scale
  svm_nu: 0.1
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples: 5
  hdbscan_metric: euclidean

collectors_curve:
  enabled: true
  group_col: Depth
  color_col: Color
  permutations: 999
  seed: 42
  out_prefix: metadata/collectors_curve
  title: "Collector's Curves"
  formats: pdf,svg
  xpad: 0.5
  max_cols: 3
  show_perms: 10
  presence_threshold: 0.0

plot_upset:
  enabled: true
  sub_dir: .
  domain: micro
  taxonomy_path:
  sample_id_col: sampleID
  group_col: Depth
  color_col: Color
  subset_groups:
  skip_venn: true
  raw_only: false
  final_only: false
  formats: pdf,svg,png

bubbleplotter:
  enabled: true
  output_prefix: metadata/bubble_plot_asv
  formats: pdf,png
  figsize: "32,60"
  bubble_scale: 10
  no_auto_size: true

umap_clustering:
  enabled: true
  output_prefix: metadata/umap_clustering
  formats: pdf,png
  normalize: clr
  transform: sqrt
  min_cluster_size: 10
  min_samples: 5

diversity:
  enabled: true
  output_dir: diversity
  mito_output_dir: mito/diversity
  mito_input:
  sample_col: sampleID
  group_col: Depth
  color_col: Color
  secondary_col: Season
  exclude_groups: []
  group_order: []
  run_mito: true
  umap_neighbors: 30
  umap_min_dist: 0.01
  permanova_perms: 999
  random_state: 42
  verbose: true

indicspecies:
  enabled: true
  sample_col: sampleID
  group_cols:
    - Season
    - o2_subcompartment_final
    - anomaly_type 
  perms: 999
  min_n: 2
  plot_enabled: true
  plot_pairs_mode: all
  plot_output_dir: indicspecies/plots
  aligned_plot_enabled: false
  aligned_plot_output_dir: indicspecies/aligned
  aligned_alpha: 0.05
  aligned_min_stat: 0.0
  aligned_top_n: 25
  venn:
  taxonomy: /cephfs/rjm_work/si_asv/NF_V4_ncbi_output/taxonomy/ASV_SILVA_tax.full-length.vsearch.tsv

power_analysis:
  enabled: false
  output_dir: power_analysis
  sample_col: sampleID
  patient_col: Participant_ID
  case_col: Case
  type_col: Depth
  sample_sizes_cancer: 6,8,10,15,20,25,30
  sample_sizes_stype: 10,15,20,25,30,40,50
  n_control: 25
  n_simulations: 1000
  n_perm: 199
  alpha: 0.05
  seed: 42
  skip_estimate: false
  skip_plot: false
  transform: none
  keep_contralateral_in_cancer: false
  contralateral_sample_types: 20m,50m

bray_patient_aware:
  enabled: false
  output_dir: bray_patient_aware
  sample_col: sampleID
  patient_col: Participant_ID
  case_col: Case
  type_col: Depth
  sample_types: 20m,50m,150m
  exclude_contralateral_in_cancer: false
  contralateral_col: lung_status
  cancer_site_col: Cancer_Site
  lung_side_col: lung_code
  contralateral_value: Contralateral
  contralateral_sample_types: 20m,50m
  transform: none
  permutations: 9999
  seed: 42
  require_complete_types: false

taxonomy_patient_aware:
  enabled: false
  output_dir: taxonomy_patient_aware
  sample_col: sampleID
  patient_col: Participant_ID
  case_col: Case
  type_col: Depth
  count_col: count
  tax_levels: Phylum,Family
  sample_types: 20m,50m,150m
  min_prevalence: 0.10
  exclude_contralateral_in_cancer: false
  contralateral_col: lung_status
  cancer_site_col: Cancer_Site
  lung_side_col: lung_code
  contralateral_value: Contralateral
  contralateral_sample_types: 20m,50m
  skip_omnibus: false
  transform: none
  alpha: 0.05
  top_n: 12

lung_status_analysis:
  enabled: false
  output_dir: lung_status_analysis
  sample_col: sampleID
  type_col: Depth
  sample_types: 20m,50m
  case_col: Case
  patient_col: Participant_ID
  cancer_site_col: Cancer_Site
  lung_code_col: lung_code
  tumor_side_col: TumorSide
  contralateral_col: Contralateral
  healthy_col: Healthy
  lung_status_col: lung_status

clustermaps:
  enabled: true
  output_dir: clustermaps
  mito_output_dir: mito/clustermaps
  mito_input:
  isa_file: /cephfs/rjm_work/si_asv/NF_V4_ncbi_output/indicspecies/
  run_mito: true
  sample_col: sampleID
  sample_code_col: sample_code
  asv_id_col: ASV_ID
  group1_col: Depth
  group2_col: Season
  group3_col: o2_subcompartment_final
  group4_col: anomaly_type
  group1_order:
  exclude_group1:
  group1_palette: 
  group2_palette:
  group3_palette:
  group4_palette:
  ranks: Phylum,Class,Order,Family,Genus,Species,ASV_ID
  topN: Phylum=30,Class=30,Order=30,Family=30,Genus=30,Species=30,ASV_ID=6000
  count_col: corr_count
  isa_min_stat: 0.6
  isa_significance_cols:
  isa_stat_cols:
  mito_sample_mode: auto

spieceasi:
  enabled: true
  output_dir: spieceasi
  prefix: spieceasi
  network_enabled: true
  modules_enabled: true
  module_methods: leiden,louvain
  module_primary_method: leiden
  module_resolutions: 0.5,1.0,1.5
  module_reps: 25
  module_consensus_threshold: 0.8
  module_seed: 42
  modules_sub:
  modules_all:
  graph_pos_all:
  graph_pos_sub:
  node_features:
  network_modes:
    - all
  transpose: true
  min_rel_abund: 0.005
  min_prevalence: 0.10
  remove_zero_var: true
  method: glasso
  lambda_min_ratio: 0.01
  nlambda: 20
  rep_num: 50
  thresh: 0.1
  ncores: 8
  seed: 10010
  edge_threshold: 0.1
  keep_negative: true
  layout_iters: 1000
  force_filter: true
  force_spieceasi: true
  force_graphs: true
  layout_seed: 42
  layout_scale: 3.0
  degree_scale: 80.0
  edge_width_scale: 5.0
  isa_scale: 500.0

trajectory_analysis:
  enabled: false
  output_dir: trajectory_analysis
  month_col: Month
  group_cols:
    - Depth
    - cluster_after
  color_col: Color
  top_taxa: 10

stratification:
  enabled: false
  output_dir: stratification_timeseries_analysis
  date_col: Date
  month_col: Month
  year_col: Year
  depth_col: Depth
  consensus_threshold: 2
  sample_id_col: sampleID
  trajectory_group_col: cluster_after
  trajectory_summary:

assign_compartments:
  enabled: false
  output_dir: compartments
  depth_col: Depth
  month_col: Month
  biochem_cols:
    - Temperature
    - Oxygen
    - Nitrogen Oxides
    - Nitrate
    - Nitrite
    - Ammonium
    - Nitrous Oxide
    - Hydrogen Sulfide
    - Dimethyl Sulfide
    - Methane
    - Phosphate
    - Silicate
  use_integrated: true
  verbose: true

environments:
  main: envs/asv_pipeline.yml
  sina: envs/sina.yml
  taxonomy: envs/qiime2.yml
  mitomaster: envs/mitomaster.yml
  mito_checker: envs/mito_checker.yml
  filter_counts: envs/filter_counts.yml
  general_stats: envs/general_stats.yml
  sankey: envs/sankey.yml
  plot_metadata: envs/plot_metadata.yml
  batch_correction: envs/asv_batch_correction.yml
  assign_compartments: envs/assign_compartments.yml
  trajectory_analysis: envs/trajectory_analysis.yml
  stratification: envs/stratification.yml
  outlier_checker: envs/outlier_checker.yml
  collectors_curve: envs/collectors_curve.yml
  biochem_pre_asv: envs/biochem.yml
  biochem_merge: envs/biochem.yml
  biochem_density: envs/biochem.yml
  biochem_strat_metrics: envs/biochem.yml
  biochem_custom_clean: envs/biochem.yml
  biochem_eigenvectors: envs/biochem.yml
  biochem_selectk: envs/biochem.yml
  biochem_gmm: envs/biochem.yml
  biochem_o2_soft: envs/biochem.yml
  biochem_hybrid: envs/biochem.yml
  biochem_compare: envs/biochem.yml
  biochem_split_o2_by_gmm: envs/biochem.yml
  biochem_strat_anomaly: envs/biochem.yml
  biochem_state_transitions: envs/biochem.yml
  biochem_succession: envs/biochem.yml
  biochem_feature_assoc: envs/biochem.yml
  biochem_eof_pipeline: envs/biochem.yml
  biochem_eof_state_cluster: envs/biochem.yml
  biochem_eof_mode_plots: envs/biochem.yml
  biochem_within_gmm: envs/biochem.yml
  diversity: envs/advanced.yml
  indicspecies: envs/advanced.yml
  clustermaps: envs/advanced.yml
  bray_patient_aware: envs/advanced.yml
  taxonomy_patient_aware: envs/advanced.yml
  lung_status_analysis: envs/advanced.yml
  spieceasi: envs/advanced.yml
  network_modules: envs/advanced.yml
  network: envs/advanced.yml
