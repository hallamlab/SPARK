# Minimal template to test ASV-to-genome barrnap linkage.
# Assumes you want the normal metadata stage plus master summary, but most
# optional downstream analyses disabled.

paths:
  input_dir: /abs/path/to/fastq_dir
  output_dir: /abs/path/to/output_dir
  manifest: /abs/path/to/ref_db/sample_manifest.tsv
  work_dir: /abs/path/to/nf_work
  conda_cache_dir: /abs/path/to/conda_cache

resources:
  threads: 8
  single_end: false

mito:
  enabled: false

filter_counts:
  enabled: false

general_stats:
  enabled: true

sankey:
  enabled: false

metadata_plots:
  enabled: true
  metadata: /abs/path/to/ref_db/asv_cruise_metadata.tsv
  sample_col: sampleID
  type_col: Depth
  color_col: Color
  run_micro: true
  run_mito: false

batch_correction:
  enabled: false

outlier_detection:
  enabled: false

collectors_curve:
  enabled: false

diversity:
  enabled: false

indicspecies:
  enabled: false
  aligned_plot_enabled: false

clustermaps:
  enabled: false

spieceasi:
  enabled: false

asv_mag_link:
  enabled: true
  genome_qc_dir: /abs/path/to/genome_qc_run
  genome_qc_dirs:
  barrnap_dir:
  genome_fasta_dir:
  output_dir: asv_mag_link
  threads: 8
  min_pident: 97.0
  min_qcov: 90.0
  top_n: 5
  plot_top_n: 20

master_summary:
  enabled: true

biochem_pre_asv:
  enabled: false
