paths:
  input_dir: /home/ryan/Experiments/Community_Composition/25-07-30/Raw_Data
  output_dir: /home/ryan/Experiments/Community_Composition/25-07-30/nf_output
  manifest: /home/ryan/Community_Composition_Manifest_ampliseq_fixed.tsv
  work_dir: /home/ryan/nf_work
  conda_cache_dir: /home/ryan/nf_work/conda_cache
    # Optional: set to an NFS/CephFS path to override Nextflow's -w (e.g. /mnt/ceph/work)

resources:
  threads: 12          # per-sample processes (FASTP/MERGE/FILTER) use this many threads
  single_end: false

fastp:
  trim_front_r1: 19
  trim_tail_r1: 20
  trim_front_r2: 20
  trim_tail_r2: 20

merge:
  max_diffs: 20
  min_overlap: 5
  trunc_quality: 5
  allow_stagger: true

filter:
  max_ee: 1.0
  min_len: 245
  max_len: 1500

concat:
  relabel: true
  label_sep: ":"

unoise:
  min_size: 3

swarm:
  distance: 1

sina:
  reference:
  reference_url: https://www.arb-silva.de/fileadmin/silva_databases/release_138_2/ARB_files/SILVA_138.2_SSURef_NR99_03_07_24_opt.arb.gz
  download_subdir: sina_reference
  regions:
    - V4
  trim_to: V4
  batch_size: 1000000
  keep_gaps: false
  threads: 16
  verbose: false

taxonomy:
  ref_taxonomy:
  ref_taxonomy_url: https://data.qiime2.org/2024.10/common/silva-138-99-tax.qza
  ref_taxonomy_filename: silva-138_2-ssu-nr99-tax.qza
  ref_sequences:
  ref_sequences_url: https://data.qiime2.org/2024.10/common/silva-138-99-seqs.qza
  ref_sequences_filename: silva-138_2-ssu-nr99-seqs-DNA.qza
  download_subdir: taxonomy_reference
  output_dir: taxonomy
  output_tsv: ASV_SILVA_tax.full-length.vsearch.tsv
  stats_tsv: ASV_SILVA_stats.full-length.vsearch.tsv
  uppercase_fasta: ASVs.upper.fasta
  threads: 16

mito:
  enabled: true
  chunk_dir:
  chunk_size: 10
  mitomaster_workers: 8
  mitomaster_retries: 4
  mitomaster_timeout: 90
  mitomaster_header_mode: first
  output_dir: mito/mitomap
  prefix: nontarget
  formats: svg,pdf
  min_pident: 97.0
  min_percov: 51.0
  mitochondria_substring: mitochondria
  feature_col: "Feature ID"
  taxon_col: Taxon
  consensus_col: Consensus
  steps: "BioFactorial,Qiime_NB_FULL,MITOMASTER,BLAST_mito"
  host_first_step: BioFactorial
  figsize: 10x6
  style: whitegrid
  dpi: 300
  no_plots: false
  blast_threads: 16
  mito_db: /home/ryan/ref_db/mito_ncbi
  biof_db: /home/ryan/ref_db/ssu_pipeline_contaminants

filter_counts:
  enabled: true
  metadata: /home/ryan/Community_Composition_Metadata_ampliseq.tsv
  output: ASV_target.tsv
  group_col: Lighting
  min_group_size: 3
  abundance_threshold: 0.005
  sample_id_col: sampleID
  min_consensus: 0.0
  taxon_col: Taxon
  consensus_col: Consensus
  biofactorial_col: BioFactorial
  mito_cols:
    - MITOMASTER
    - BLAST_mito
  save_intermediates: true
  mito_output_dir: mito/ASVs

general_stats:
  enabled: true

sankey:
  enabled: true
  metadata: /home/ryan/Community_Composition_Metadata_ampliseq.tsv
  sub_dir: .
  sample_col: sampleID
  group1_col: Lighting
  color_col: Color
  keep_types:
    - Light
    - Dark
  output_prefix: metadata/data_loss_sankey
  title: Data Loss Flow
  make_labeled: true
  make_unlabeled: true

metadata_plots:
  enabled: false
  metadata: ../ref_db/asv_cruise_metadata.tsv
  sub_dir: .
  type_col: Depth
  color_col: Color
  keep_types:
    - Oral Rinse
    - Lung Brush
    - BAL
    - Skin Brush
    - Scope Flush
  include_rank: []
  run_micro: true
  run_mito: true

batch_correction:
  enabled: true
  output_dir: batch_correction
  batch_col: plateID
  asv_orientation: features_rows
  biological_covariates:
  biological_color_col: Depth,Month
  color_palette_col: Color
  umap_neighbors: 15
  umap_min_dist: 0.1
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples:
  hdbscan_selection_method: eom
  optimize_clustering: false
  target_clusters: 3-8
  n_features_plot: 5
  random_state: 42

assign_compartments:
  enabled: true
  output_dir: compartments
  depth_col: Depth
  month_col: Month
  biochem_cols:
    - Temperature
    - Oxygen
    - Nitrogen Oxides
    - Nitrate
    - Nitrite
    - Ammonium
    - Nitrous Oxide
    - Hydrogen Sulfide
    - Dimethyl Sulfide
    - Methane
    - Phosphate
    - Silicate
  use_integrated: true
  verbose: true

trajectory_analysis:
  enabled: true
  output_dir: trajectory_analysis
  month_col: Month
  group_cols:
    - Depth
    - cluster_after
  color_col: Color
  top_taxa: 10

stratification:
  enabled: true
  output_dir: stratification_timeseries_analysis
  date_col: Date
  month_col: Month
  year_col: Year
  depth_col: Depth
  consensus_threshold: 2
  sample_id_col: sampleid
  trajectory_group_col: cluster_after
  trajectory_summary:

outlier_detection:
  enabled: true
  output_dir: outliers_corrected
  group_cols:
    - Depth
  transform: none
  asv_orientation: samples_rows
  pre_transformed: true
  scale: false
  use_iso: true
  use_svm: true
  use_hdb: true
  vote_threshold: 3
  iso_contamination: auto
  iso_estimators: 200
  iso_random_state: 42
  svm_kernel: rbf
  svm_gamma: scale
  svm_nu: 0.1
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples: 5
  hdbscan_metric: euclidean

collectors_curve:
  enabled: true
  group_col: Depth
  color_col: Color
  permutations: 999
  seed: 42
  out_prefix: metadata/collectors_curve
  title: "Collector's Curves"
  formats: pdf,svg
  xpad: 0.5
  max_cols: 3
  show_perms: 10
  presence_threshold: 0.0

table_filter:
  min_sample_sum: 5000
  min_asv_sum: 0.01
  script: filter_ASV_table.py

filename_patterns:
  r1_tokens:
    - R1
    - 1
  r2_tokens:
    - R2
    - 2
  ext_patterns:
    - "\\.fastq\\.gz$"
    - "\\.fq\\.gz$"
    - "\\.fastq$"
    - "\\.fq$"
  sample_strip_regex: "(_S[0-9]+)?(_L[0-9]{3})?(_R[12])?(_[12])?(_001)?$"

environments:
  main: envs/asv_pipeline.yml
  sina: envs/sina.yml
  taxonomy: envs/qiime2.yml
  mitomaster: envs/mitomaster.yml
  mito_checker: envs/mito_checker.yml
  filter_counts: envs/filter_counts.yml
  general_stats: envs/general_stats.yml
  sankey: envs/sankey.yml
  plot_metadata: envs/plot_metadata.yml
  batch_correction: envs/asv_batch_correction.yml
  assign_compartments: envs/assign_compartments.yml
  trajectory_analysis: envs/trajectory_analysis.yml
  stratification: envs/stratification.yml
  outlier_checker: envs/outlier_checker.yml
  collectors_curve: envs/collectors_curve.yml
