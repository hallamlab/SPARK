paths:
  input_dir: /home/ryan/Projects/UBC/LMP/spark_set1_output/
  output_dir: /home/ryan/Projects/UBC/LMP/spark_set1_output
  manifest: /home/ryan/Projects/UBC/LMP/spark_set1_manifest.tsv
  work_dir: /home/ryan/Projects/UBC/LMP/spark_set1_output/nf_work
  conda_cache_dir: /home/ryan/Projects/UBC/LMP/spark_set1_output/conda_cache
    # Optional: set to an NFS/CephFS path to override Nextflow's -w (e.g. /mnt/ceph/work)

resources:
  threads: 6         # per-sample processes (FASTP/MERGE/FILTER) use this many threads
  single_end: false


biochem_pre_asv:
  enabled: false

filename_patterns:
  r1_tokens:
    - R1
    - 1
  r2_tokens:
    - R2
    - 2
  ext_patterns:
    - "\\.fastq\\.gz$"
    - "\\.fq\\.gz$"
    - "\\.fastq$"
    - "\\.fq$"
  sample_strip_regex: "(_S[0-9]+)?(_L[0-9]{3})?(_R[12])?(_[12])?(_001)?$"

fastp:
  trim_front_r1: 19
  trim_tail_r1: 20
  trim_front_r2: 20
  trim_tail_r2: 20

merge:
  max_diffs: 20
  min_overlap: 5
  trunc_quality: 5
  allow_stagger: true

table_filter:
  min_sample_sum: 5000
  min_asv_sum: 0
  script: filter_ASV_table.py

filter:
  max_ee: 1.0
  min_len: 245
  max_len: 1500

concat:
  relabel: true
  label_sep: ":"

unoise:
  min_size: 3

swarm:
  distance: 1

sina:
  reference:
  reference_url: https://www.arb-silva.de/fileadmin/silva_databases/release_138_2/ARB_files/SILVA_138.2_SSURef_NR99_03_07_24_opt.arb.gz
  download_subdir: sina_reference
  regions:
    - V4-V5
    - V5
    - V4
  trim_to: V4-V5
  batch_size: 1000000
  keep_gaps: false
  threads: 6
  verbose: false

taxonomy:
  ref_taxonomy:
  ref_taxonomy_url: https://data.qiime2.org/2024.10/common/silva-138-99-tax.qza
  ref_taxonomy_filename: silva-138_2-ssu-nr99-tax.qza
  ref_sequences:
  ref_sequences_url: https://data.qiime2.org/2024.10/common/silva-138-99-seqs.qza
  ref_sequences_filename: silva-138_2-ssu-nr99-seqs-DNA.qza
  download_subdir: taxonomy_reference
  output_dir: taxonomy
  output_tsv: ASV_SILVA_tax.full-length.vsearch.tsv
  stats_tsv: ASV_SILVA_stats.full-length.vsearch.tsv
  uppercase_fasta: ASVs.upper.fasta
  threads: 6

mito:
  enabled: true
  chunk_dir:
  chunk_size: 10
  mitomaster_workers: 8
  mitomaster_retries: 4
  mitomaster_timeout: 90
  mitomaster_header_mode: first
  output_dir: mito/mitomap
  prefix: nontarget
  formats: svg,pdf
  min_pident: 97.0
  min_percov: 51.0
  mitochondria_substring: mitochondria
  feature_col: "Feature ID"
  taxon_col: Taxon
  consensus_col: Consensus
  steps: "BioFactorial,Qiime_NB_FULL,MITOMASTER,BLAST_mito"
  host_first_step: BioFactorial
  figsize: 10x6
  style: whitegrid
  dpi: 300
  no_plots: false
  blast_threads: 6
  mito_db: /home/ryan/Projects/UBC/LMP/ref_db/mito_ncbi
  biof_db: /home/ryan/Projects/UBC/LMP/ref_db/ssu_pipeline_contaminants

filter_counts:
  enabled: true
  metadata: /home/ryan/Projects/UBC/LMP/spark_set1_metadata.tsv
  output: ASV_target.tsv
  group_col: Type_Group
  min_group_size: 3
  abundance_threshold: 0.5
  sample_id_col: Sample
  min_consensus: 0.0
  taxon_col: Taxon
  consensus_col: Consensus
  biofactorial_col: BioFactorial
  mito_cols:
    - MITOMASTER
    - BLAST_mito
  save_intermediates: true
  mito_output_dir: mito/ASVs

general_stats:
  enabled: true

sankey:
  enabled: true
  metadata: /home/ryan/Projects/UBC/LMP/spark_set1_metadata.tsv
  sub_dir: .
  sample_col: Sample
  group1_col: Type_Group
  color_col: Color
  keep_types:
  arrangement: freeform
  output_prefix: metadata/data_loss_sankey
  title: Data Loss Flow
  make_labeled: true
  make_unlabeled: true

metadata_plots:
  enabled: true
  metadata: /home/ryan/Projects/UBC/LMP/spark_set1_metadata.tsv
  sub_dir: .
  sample_col: Sample
  type_col: Type_Group
  color_col: Color
  subtraction_group_col: Type_Group
  subtraction_groups: ['Scope Flush', 'Skin Brush', 'Control']
  keep_types:
    - Oral Rinse
    - BAL
    - Bronchial Brush
  group_order:
    - Oral Rinse
    - BAL
    - Bronchial Brush
  include_rank: []
  run_micro: true
  run_mito: true

batch_correction:
  enabled: false
  output_dir: batch_correction
  sample_id_col: Sample
  batch_col: DNA_plate
  asv_orientation: features_rows
  biological_covariates: Type_Group
  biological_color_col: Type_Group
  color_palette_col: Color
  conqur_mode: standard
  conqur_num_core: 6
  conqur_batch_ref:
  conqur_logistic_lasso: true
  conqur_quantile_type: lasso
  conqur_simple_match: true
  conqur_lambda_quantile: 2p/logn
  conqur_interplt: false
  conqur_delta: 0.4999
  conqur_auto_install: true
  umap_neighbors: 15
  umap_min_dist: 0.1
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples:
  hdbscan_selection_method: eom
  optimize_clustering: false
  target_clusters: 3-8
  n_features_plot: 5
  random_state: 42

outlier_detection:
  enabled: true
  output_dir: outliers_corrected
  sample_col: Sample
  group_cols:
    - type_group,Case
  transform: none
  asv_orientation: Samples_rows
  pre_transformed: true
  scale: false
  use_iso: true
  use_svm: true
  use_hdb: true
  vote_threshold: 3
  iso_contamination: auto
  iso_estimators: 200
  iso_random_state: 42
  svm_kernel: rbf
  svm_gamma: scale
  svm_nu: 0.1
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples: 5
  hdbscan_metric: euclidean

collectors_curve:
  enabled: true
  sample_col: Sample
  group_col: Type_Group
  color_col: Color
  group_order:
    - Oral Rinse
    - BAL
    - Bronchial Brush
  permutations: 999
  seed: 42
  out_prefix: metadata/collectors_curve
  title: "Collector's Curves"
  formats: pdf,svg
  xpad: 0.5
  max_cols: 3
  show_perms: 10
  presence_threshold: 0.0

