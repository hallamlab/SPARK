paths:
  input_dir: /home/ryan/Projects/UBC/LMP/avery_spark_output/input_fastqs
  output_dir: /home/ryan/Projects/UBC/LMP/avery_spark_output
  manifest: /home/ryan/Projects/UBC/LMP/avery_spark_output/sample_manifest.tsv
  work_dir: /home/ryan/Projects/UBC/LMP/avery_spark_output/nf_work
  conda_cache_dir: /home/ryan/Projects/UBC/LMP/avery_spark_output/input_fastqs/conda_cache
    # Optional: set to an NFS/CephFS path to override Nextflow's -w (e.g. /mnt/ceph/work)

resources:
  threads: 6         # per-sample processes (FASTP/MERGE/FILTER) use this many threads
  single_end: false


biochem_pre_asv:
  enabled: false
  table_a: /cephfs/rjm_work/si_asv/ref_db/SI_JA_Compiled_Geochem_Dec_09_Outlier_RM.csv
  table_b: /cephfs/rjm_work/si_asv/ref_db/SI_JA_Compiled_CTD_Data_Dec_18_2025_Outlier_RM.csv
  output_root: /cephfs/rjm_work/si_asv/NF_V4_ncbi_output/biochem_pipeline
  cleaned_density_filename: 02_oxygen_best_available_density_RJM.tsv
  clean_keep_cols:
    - cruise_year_month_depth
    - Cruise
    - Year
    - Month
    - Day
    - Depth
    - Phosphate
    - Silicate
    - Nitrite
    - Nitrate
    - Ammonium
    - Hydrogen Sulfide
    - Nitrous Oxide
    - Methane
    - Temperature
    - Salinity
    - Oxygen
    - Density
    - Fe
    - Dimethyl Sulfide
  clean_drop_cols: []
  clean_rename_map:
    PO4: Phosphate
    SI: Silicate
    NO2: Nitrite
    NO3: Nitrate
    NH4: Ammonium
    H2S: Hydrogen Sulfide
    N2O: Nitrous Oxide
    CH4: Methane
    Oxygen_best_available: Oxygen
    density_kg_m3: Density
  feature_cols: Oxygen,Nitrate,Nitrite,Nitrous Oxide,Ammonium,Hydrogen Sulfide,Methane,Phosphate,Silicate,Temperature,Salinity,Density,Fe,Dimethyl Sulfide
  gmm_k: auto
  eof_pcs: 1,2,4

filename_patterns:
  r1_tokens:
    - R1
    - 1
  r2_tokens:
    - R2
    - 2
  ext_patterns:
    - "\\.fastq\\.gz$"
    - "\\.fq\\.gz$"
    - "\\.fastq$"
    - "\\.fq$"
  sample_strip_regex: "(_S[0-9]+)?(_L[0-9]{3})?(_R[12])?(_[12])?(_001)?$"

fastp:
  trim_front_r1: 19
  trim_tail_r1: 20
  trim_front_r2: 20
  trim_tail_r2: 20

merge:
  max_diffs: 20
  min_overlap: 5
  trunc_quality: 5
  allow_stagger: true

table_filter:
  min_sample_sum: 5000
  min_asv_sum: 0
  script: filter_ASV_table.py

filter:
  max_ee: 1.0
  min_len: 245
  max_len: 1500

concat:
  relabel: true
  label_sep: ":"

unoise:
  min_size: 3

swarm:
  distance: 1

sina:
  reference:
  reference_url: https://www.arb-silva.de/fileadmin/silva_databases/release_138_2/ARB_files/SILVA_138.2_SSURef_NR99_03_07_24_opt.arb.gz
  download_subdir: sina_reference
  regions:
    - V4-V5
    - V5
    - V4
  trim_to: V4-V5
  batch_size: 1000000
  keep_gaps: false
  threads: 6
  verbose: false

taxonomy:
  ref_taxonomy:
  ref_taxonomy_url: https://data.qiime2.org/2024.10/common/silva-138-99-tax.qza
  ref_taxonomy_filename: silva-138_2-ssu-nr99-tax.qza
  ref_sequences:
  ref_sequences_url: https://data.qiime2.org/2024.10/common/silva-138-99-seqs.qza
  ref_sequences_filename: silva-138_2-ssu-nr99-seqs-DNA.qza
  download_subdir: taxonomy_reference
  output_dir: taxonomy
  output_tsv: ASV_SILVA_tax.full-length.vsearch.tsv
  stats_tsv: ASV_SILVA_stats.full-length.vsearch.tsv
  uppercase_fasta: ASVs.upper.fasta
  threads: 6

mito:
  enabled: true
  chunk_dir:
  chunk_size: 10
  mitomaster_workers: 8
  mitomaster_retries: 4
  mitomaster_timeout: 90
  mitomaster_header_mode: first
  output_dir: mito/mitomap
  prefix: nontarget
  formats: svg,pdf
  min_pident: 97.0
  min_percov: 51.0
  mitochondria_substring: mitochondria
  feature_col: "Feature ID"
  taxon_col: Taxon
  consensus_col: Consensus
  steps: "BioFactorial,Qiime_NB_FULL,MITOMASTER,BLAST_mito"
  host_first_step: BioFactorial
  figsize: 10x6
  style: whitegrid
  dpi: 300
  no_plots: false
  blast_threads: 6
  mito_db: /home/ryan/Projects/UBC/LMP/ref_db/mito_ncbi
  biof_db: /home/ryan/Projects/UBC/LMP/ref_db/ssu_pipeline_contaminants

filter_counts:
  enabled: true
  metadata: /home/ryan/Projects/UBC/LMP/avery_spark_output/Sample_metadata.tsv
  output: ASV_target.tsv
  group_col: type_group
  min_group_size: 3
  abundance_threshold: 0.5
  sample_id_col: sample
  min_consensus: 0.0
  taxon_col: Taxon
  consensus_col: Consensus
  biofactorial_col: BioFactorial
  mito_cols:
    - MITOMASTER
    - BLAST_mito
  save_intermediates: true
  mito_output_dir: mito/ASVs

general_stats:
  enabled: true

sankey:
