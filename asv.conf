# ================================
# ASV Pipeline Config
# ================================

# Required
INPUT_DIR="/home/ryan/SABer_dat/SI_data/SI_ASV/V4_ncbi_input"
OUTPUT_DIR="/home/ryan/SABer_dat/SI_data/SI_ASV/V4_ncbi_output"

# Optional (leave empty to auto-detect)
THREADS=""                 # default: nproc
SINGLE_END="false"         # true|false (if true, merging is skipped per-sample logic)

# fastp (QC)
FASTP_TRIM_FRONT_R1=19     # -f
FASTP_TRIM_TAIL_R1=80      # -t
FASTP_TRIM_FRONT_R2=20     # -F
FASTP_TRIM_TAIL_R2=80      # -T

# vsearch merge
MERGE_MAXDIFFS=20          # --fastq_maxdiffs
MERGE_MINOVLEN=5           # --fastq_minovlen
MERGE_TRUNQUAL=5          # --fastq_truncqual
MERGE_ALLOW_STAGGER="true" # --fastq_allowmergestagger

# vsearch filter
FILTER_MAXEE=1.0           # --fastq_maxee
FILTER_MINLEN=245          # --fastq_minlen
FILTER_MAXLEN=1500          # --fastq_maxlen

# vsearch UNOISE / denoise
UNOISE_MINSIZE=3           # --minsize

# swarm
SWARM_D=1                  # -d

# table filtering (your Python script)
TABFILT_MIN_SAMPLE_SUM=5000
TABFILT_MIN_ASV_SUM=0.01
TABFILT_SCRIPT="filter_ASV_table.py"

# Advanced filename handling
# Recognized R1 tokens (regex alternation, ordered): R1|1
R1_TOKENS="R1|1"
# Matching R2 tokens (must be same count/order as R1)
R2_TOKENS="R2|2"

# Recognized extensions (ordered, first match wins)
# Each is a regex suffix that will be stripped/replaced when parsing.
EXT_PATTERNS="\.fastq\.gz$|\.fq\.gz$|\.fastq$|\.fq$"

# Common Illumina affixes to strip from sample names (regex)
SAMPLE_STRIP_REGEX="(_S[0-9]+)?(_L[0-9]{3})?(_R[12])?(_[12])?(_001)?$"
